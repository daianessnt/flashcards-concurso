<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards Concurso</title>

<style>
:root {
  --bg: #f6f8fb;
  --card: #ffffff;
  --primary: #355f8a;
  --success: #2f8f5b;
  --error: #c95a5a;
  --text: #2b2b2b;
}

* {
  box-sizing: border-box;
  font-family: "Segoe UI", Roboto, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

header {
  background: var(--primary);
  color: white;
  padding: 1rem;
  text-align: center;
  font-size: 1.4rem;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 1rem;
}

button {
  width: 100%;
  padding: 0.9rem;
  margin: 0.4rem 0;
  border: none;
  border-radius: 8px;
  font-size: 1rem;
  cursor: pointer;
  background: var(--primary);
  color: white;
}

button.secondary { background: #6c757d; }
button.success { background: var(--success); }
button.error { background: var(--error); }

.card {
  background: var(--card);
  border-radius: 14px;
  padding: 1.6rem;
  box-shadow: 0 6px 14px rgba(0,0,0,0.06);
}

.pergunta {
  font-size: 1.2rem;
  text-align: center;
}

.resposta {
  margin-top: 1rem;
  font-size: 1.1rem;
  color: var(--success);
  text-align: center;
}

.hidden { display: none; }

.stats {
  text-align: center;
  margin-top: 0.6rem;
  font-size: 0.9rem;
}
</style>
</head>

<body>

<header>Flashcards para Concurso</header>

<div class="container">

<!-- MENU -->
<div id="menu">
  <button onclick="iniciar('portugues')">Língua Portuguesa</button>
  <button onclick="alert('Estrutura pronta – inserir conteúdo')">Raciocínio Lógico</button>
  <button onclick="alert('Estrutura pronta – inserir conteúdo')">Conhecimentos Específicos</button>
</div>

<!-- FLASHCARD -->
<div id="flash" class="hidden">
  <div class="card">
    <div id="pergunta" class="pergunta"></div>
    <div id="resposta" class="resposta hidden"></div>
  </div>

  <button onclick="mostrarResposta()">Mostrar resposta</button>
  <button class="success" onclick="marcar(true)">Acertei</button>
  <button class="error" onclick="marcar(false)">Errei</button>

  <div class="stats" id="stats"></div>

  <button class="secondary" onclick="voltar()">Voltar ao menu</button>
</div>

</div>

<script>
/* ================= DADOS ================= */

const flashcards = {
 portugues: [
  {
    q: "O que é compreensão textual?",
    r: "É a capacidade de identificar informações explícitas presentes no texto.",
    peso: 1
  },
  {
    q: "O que é interpretação textual?",
    r: "É a capacidade de inferir informações implícitas, indo além do que está literalmente escrito.",
    peso: 1
  },
  {
    q: "Diferença principal entre compreensão e interpretação",
    r: "Compreensão trata do explícito; interpretação envolve inferência e leitura nas entrelinhas.",
    peso: 1
  },
  {
    q: "O que é tipologia textual?",
    r: "Classificação dos textos conforme sua estrutura linguística predominante.",
    peso: 1
  },
  {
    q: "Texto narrativo – característica principal",
    r: "Relato de fatos ou acontecimentos, com personagens, tempo e espaço.",
    peso: 1
  },
  {
    q: "Texto descritivo – característica principal",
    r: "Caracterização de pessoas, objetos, ambientes ou sentimentos.",
    peso: 1
  },
  {
    q: "Texto dissertativo-argumentativo – característica principal",
    r: "Apresenta ideias, opiniões e argumentos para defender um ponto de vista.",
    peso: 1
  },
  {
    q: "Texto injuntivo – finalidade",
    r: "Orientar, instruir ou aconselhar o leitor por meio de ordens ou instruções.",
    peso: 1
  },
  {
    q: "Texto expositivo – objetivo",
    r: "Explicar, informar ou apresentar conceitos de forma objetiva.",
    peso: 1
  },
  {
    q: "Gêneros textuais – definição",
    r: "Formas de uso social da língua, como carta, e-mail, notícia, edital, relatório.",
    peso: 1
  },
  {
    q: "Diferença entre tipologia e gênero textual",
    r: "Tipologia é estrutural; gênero é social e funcional.",
    peso: 1
  },
  {
    q: "O que são informações explícitas?",
    r: "Aquelas expressas diretamente no texto.",
    peso: 1
  },
  {
    q: "O que são informações implícitas?",
    r: "Aquelas que precisam ser inferidas a partir do texto.",
    peso: 1
  },
  {
    q: "Inferência textual – conceito",
    r: "Processo de deduzir informações não ditas explicitamente com base no texto.",
    peso: 1
  },
  {
    q: "Principal erro em questões de interpretação",
    r: "Responder com base em opinião pessoal e não no texto.",
    peso: 1
  },
  {
    q: "Coerência textual – definição",
    r: "Relação lógica entre as ideias do texto.",
    peso: 1
  },
  {
    q: "Coesão textual – definição",
    r: "Ligação entre palavras, frases e parágrafos por meio de conectivos e pronomes.",
    peso: 1
  },
/* ===== BLOCO 2 — SEMÂNTICA ===== */
{
  q: "O que é denotação?",
  r: "É o sentido literal da palavra, aquele registrado no dicionário.",
  peso: 1
},
{
  q: "O que é conotação?",
  r: "É o sentido figurado da palavra, dependente do contexto.",
  peso: 1
},
{
  q: "Frase em sentido denotativo — característica",
  r: "Não admite interpretação subjetiva ou figurada.",
  peso: 1
},
{
  q: "Frase em sentido conotativo — característica",
  r: "Produz efeito expressivo, simbólico ou subjetivo.",
  peso: 1
},
{
  q: "O que são figuras de linguagem?",
  r: "Recursos expressivos que alteram o sentido literal para intensificar a mensagem.",
  peso: 1
},
{
  q: "Metáfora — definição",
  r: "Comparação implícita entre elementos por semelhança.",
  peso: 1
},
{
  q: "Metonímia — definição",
  r: "Substituição de um termo por outro com relação de proximidade.",
  peso: 1
},
{
  q: "Hipérbole — definição",
  r: "Exagero intencional para intensificar a ideia.",
  peso: 1
},
{
  q: "Eufemismo — definição",
  r: "Suavização de uma expressão considerada dura ou desagradável.",
  peso: 1
},
{
  q: "Ironia — definição",
  r: "Expressão de sentido oposto ao literal, geralmente com crítica implícita.",
  peso: 1
},
{
  q: "Personificação (prosopopeia) — definição",
  r: "Atribuição de características humanas a seres inanimados ou abstratos.",
  peso: 1
},
{
  q: "Antítese — definição",
  r: "Aproximação de ideias opostas.",
  peso: 1
},
{
  q: "Paradoxo — definição",
  r: "Associação de ideias contraditórias que produzem sentido.",
  peso: 1
},
{
  q: "O que são homônimos?",
  r: "Palavras com mesma forma ou som, mas significados diferentes.",
  peso: 1
},
{
  q: "Homônimos perfeitos — definição",
  r: "Mesma grafia e mesma pronúncia, com sentidos diferentes.",
  peso: 1
},
{
  q: "Homófonos — definição",
  r: "Mesma pronúncia e grafia diferente.",
  peso: 1
},
{
  q: "Homógrafos — definição",
  r: "Mesma grafia e pronúncia diferente.",
  peso: 1
},
{
  q: "O que são parônimos?",
  r: "Palavras parecidas na forma e na pronúncia, mas com significados diferentes.",
  peso: 1
},
{
  q: "Relações de sentido — sinônimos",
  r: "Palavras com significados semelhantes, mas não necessariamente idênticos.",
  peso: 1
},
{
  q: "Relações de sentido — antônimos",
  r: "Palavras com significados opostos.",
  peso: 1
}
];

let lista = [];
let atual = 0;
let stats = JSON.parse(localStorage.getItem("stats")) || { acertos: 0, erros: 0 };

/* ================= FUNÇÕES ================= */

function embaralhar(array) {
  return array.sort(() => Math.random() - 0.5);
}

function iniciar(materia) {
  lista = embaralhar(flashcards[materia]);
  atual = 0;
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("flash").classList.remove("hidden");
  atualizar();
}

function atualizar() {
  document.getElementById("pergunta").innerText = lista[atual].q;
  document.getElementById("resposta").innerText = lista[atual].r;
  document.getElementById("resposta").classList.add("hidden");
  atualizarStats();
}

function mostrarResposta() {
  document.getElementById("resposta").classList.remove("hidden");
}

function marcar(acertou) {
  if (acertou) {
    stats.acertos++;
    lista[atual].peso = Math.max(1, lista[atual].peso - 1);
  } else {
    stats.erros++;
    lista[atual].peso += 2;
    lista.push(lista[atual]); // reaparece
  }
  salvar();
  proximo();
}

function proximo() {
  atual = (atual + 1) % lista.length;
  atualizar();
}

function atualizarStats() {
  document.getElementById("stats").innerText =
    `Acertos: ${stats.acertos} | Erros: ${stats.erros}`;
}

function salvar() {
  localStorage.setItem("stats", JSON.stringify(stats));
}

function voltar() {
  document.getElementById("flash").classList.add("hidden");
  document.getElementById("menu").classList.remove("hidden");
}
</script>

</body>
</html>
