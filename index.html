<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards Concurso</title>

<style>
:root {
  --bg: #f6f8fb;
  --card: #ffffff;
  --primary: #355f8a;
  --success: #2f8f5b;
  --error: #c95a5a;
  --warning: #f2b705;
  --tip: #7c5cff;
  --text: #2b2b2b;
}

* {
  box-sizing: border-box;
  font-family: "Segoe UI", Roboto, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

header {
  background: var(--primary);
  color: white;
  padding: 1rem;
  text-align: center;
  font-size: 1.4rem;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 1rem;
}

/* BOTÕES */
button {
  width: 100%;
  min-height: 48px;
  padding: 0.9rem;
  margin: 0.4rem 0;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  cursor: pointer;
  color: white;
  background: var(--primary);
  transition: opacity 0.2s ease, transform 0.2s ease;
}

button:active {
  transform: scale(0.97);
}

button.success { background: var(--success); }
button.error { background: var(--error); }
button.warning { background: var(--warning); }
button.secondary { background: #6c757d; }

/* BOTÕES DE AÇÃO */
.actions {
  display: flex;
  gap: 0.6rem;
  margin-top: 0.5rem;
}

.actions button {
  flex: 1;
  font-size: 1.4rem;
  font-weight: bold;
  padding: 0.8rem;
}

/* CARD */
.card {
  background: var(--card);
  border-radius: 16px;
  padding: 1.6rem;
  box-shadow: 0 6px 14px rgba(0,0,0,0.06);
}

.pergunta {
  font-size: 1.2rem;
  text-align: center;
}

.dica {
  margin-top: 1rem;
  font-size: 1.05rem;
  color: var(--tip);
  background: rgba(124, 92, 255, 0.08);
  padding: 0.8rem;
  border-radius: 10px;
  text-align: center;
}

.resposta {
  margin-top: 1rem;
  font-size: 1.1rem;
  color: var(--success);
  background: rgba(47, 143, 91, 0.08);
  padding: 0.8rem;
  border-radius: 10px;
  text-align: center;
}

.stats {
  text-align: center;
  margin-top: 0.6rem;
  font-size: 0.9rem;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<header>Flashcards para Concurso</header>

<div class="container">

<!-- MENU -->
<div id="menu">
  <button onclick="iniciar('portugues')">Língua Portuguesa</button>
  <button onclick="alert('Estrutura pronta – inserir conteúdo')">Raciocínio Lógico</button>
  <button onclick="alert('Estrutura pronta – inserir conteúdo')">Conhecimentos Específicos</button>
  <button class="error" onclick="revisarErros()">Revisar erros</button>
</div>

<!-- FLASHCARD -->
<div id="flash" class="hidden">

  <div class="card">
    <div id="pergunta" class="pergunta"></div>
    <div id="dica" class="dica hidden"></div>
    <div id="resposta" class="resposta hidden"></div>
  </div>

  <button onclick="mostrarDica()">💡 Dica</button>
  <button onclick="mostrarResposta()">👀 Mostrar resposta</button>

  <div class="actions">
    <button class="success" onclick="marcar(true)">✔</button>
    <button class="error" onclick="marcar(false)">✖</button>
    <button class="warning" onclick="pular()">⏭</button>
  </div>

  <div class="stats" id="stats"></div>

  <button class="secondary" onclick="voltar()">Voltar ao menu</button>
  <button class="secondary" onclick="zerarProgresso()">Zerar acertos e erros</button>

</div>

</div>

<script>
/* ================= DADOS ================= */

const flashcards = {
  portugues: [
    {
      q: "O que é compreensão textual?",
      d: "Observe o que está explícito no texto.",
      r: "É a capacidade de identificar informações explícitas presentes no texto."
    },
    {
      q: "O que é interpretação textual?",
      d: "Pense no que está implícito.",
      r: "É a capacidade de inferir informações que não estão ditas diretamente."
    }
  ]
};

let lista = [];
let atual = 0;
let modoRevisao = false;

let errosSalvos = JSON.parse(localStorage.getItem("erros")) || [];

let stats = JSON.parse(localStorage.getItem("stats")) || {
  acertos: 0,
  erros: 0
};

/* ================= FUNÇÕES ================= */

function embaralhar(array) {
  return array.sort(() => Math.random() - 0.5);
}

function iniciar(materia) {
  lista = embaralhar([...flashcards[materia]]);
  modoRevisao = false;
  atual = 0;
  abrirFlash();
}

function revisarErros() {
  if (errosSalvos.length === 0) {
    alert("🎉 Você não tem erros para revisar!");
    return;
  }
  lista = embaralhar([...errosSalvos]);
  modoRevisao = true;
  atual = 0;
  abrirFlash();
}

function abrirFlash() {
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("flash").classList.remove("hidden");
  atualizar();
}

function atualizar() {
  const card = lista[atual];

  document.getElementById("pergunta").innerText = card.q;

  const dicaEl = document.getElementById("dica");
  dicaEl.innerText = card.d || "Sem dica 🙂";
  dicaEl.classList.add("hidden");

  const respostaEl = document.getElementById("resposta");
  respostaEl.innerText = card.r;
  respostaEl.classList.add("hidden");

  atualizarStats();
}

function mostrarDica() {
  document.getElementById("dica").classList.toggle("hidden");
}

function mostrarResposta() {
  document.getElementById("resposta").classList.remove("hidden");
}

function marcar(acertou) {
  if (acertou) {
    stats.acertos++;
  } else {
    stats.erros++;
    if (!modoRevisao) {
      errosSalvos.push(lista[atual]);
      localStorage.setItem("erros", JSON.stringify(errosSalvos));
    }
  }
  salvar();
  proximo();
}

function pular() {
  const card = lista.splice(atual, 1)[0];
  lista.push(card);
  atualizar();
}

function proximo() {
  atual = (atual + 1) % lista.length;
  atualizar();
}

function atualizarStats() {
  document.getElementById("stats").innerText =
    `Acertos: ${stats.acertos} | Erros: ${stats.erros}`;
}

function salvar() {
  localStorage.setItem("stats", JSON.stringify(stats));
}

function zerarProgresso() {
  if (confirm("Tem certeza que deseja zerar acertos, erros e revisões?")) {
    stats = { acertos: 0, erros: 0 };
    errosSalvos = [];
    localStorage.removeItem("stats");
    localStorage.removeItem("erros");
    atualizarStats();
    alert("Progresso zerado com sucesso ✅");
  }
}

function voltar() {
  document.getElementById("flash").classList.add("hidden");
  document.getElementById("menu").classList.remove("hidden");
}
</script>

</body>
</html>
