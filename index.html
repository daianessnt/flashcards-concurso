<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards Concurso</title>

<style>
:root {
  --bg: #f6f8fb;
  --card: #ffffff;
  --primary: #355f8a;
  --success: #2f8f5b;
  --error: #c95a5a;
  --warning: #f2b705;
  --tip: #8b5cf6;
  --text: #2b2b2b;
}

* {
  box-sizing: border-box;
  font-family: "Segoe UI", Roboto, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

header {
  background: var(--primary);
  color: white;
  padding: 1rem;
  text-align: center;
  font-size: 1.4rem;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 1rem;
}

/* BOTÕES */
button {
  width: 100%;
  min-height: 48px;
  padding: 0.9rem;
  margin: 0.4rem 0;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  cursor: pointer;
  background: var(--primary);
  color: white;
  touch-action: manipulation;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

button:active {
  transform: scale(0.97);
}

button.secondary {
  background: #6c757d;
}

button.success {
  background: var(--success);
}

button.error {
  background: var(--error);
}

button.warning {
  background: var(--warning);
}

button.tip {
  background: var(--tip);
  font-weight: 600;
}

/* AÇÕES EM LINHA */
.actions {
  display: flex;
  gap: 0.6rem;
  margin-top: 0.6rem;
}

.actions button {
  flex: 1;
  font-size: 1.5rem;
  font-weight: 700;
  padding: 0.8rem 0;
}

/* CARD */
.card {
  background: var(--card);
  border-radius: 14px;
  padding: 1.6rem;
  box-shadow: 0 6px 14px rgba(0,0,0,0.06);
}

.pergunta {
  font-size: 1.2rem;
  text-align: center;
}

.resposta {
  margin-top: 1rem;
  font-size: 1.1rem;
  color: var(--success);
  text-align: center;
}

.stats {
  text-align: center;
  margin-top: 0.6rem;
  font-size: 0.9rem;
}

.hidden {
  display: none;
}

/* MOBILE */
@media (max-width: 600px) {
  header {
    font-size: 1.2rem;
  }

  .actions button {
    font-size: 1.3rem;
  }
}
</style>
</head>

<body>

<header>Flashcards para Concurso</header>

<div class="container">

<!-- MENU -->
<div id="menu">
  <button onclick="iniciar('portugues')">Língua Portuguesa</button>
  <button onclick="alert('Estrutura pronta – inserir conteúdo')">Raciocínio Lógico</button>
  <button onclick="alert('Estrutura pronta – inserir conteúdo')">Conhecimentos Específicos</button>
  <button class="error" onclick="revisarErros()">Revisar Erros</button>
</div>

<!-- FLASHCARDS -->
<div id="flash" class="hidden">
  <div class="card">
    <div id="pergunta" class="pergunta"></div>
    <div id="resposta" class="resposta hidden"></div>
  </div>

  <button class="tip" onclick="mostrarDica()">💡 Dica</button>
  <button onclick="mostrarResposta()">Mostrar resposta</button>

  <div class="actions">
    <button class="success" onclick="marcar(true)">✔</button>
    <button class="error" onclick="marcar(false)">✖</button>
    <button class="warning" onclick="pular()">⏭</button>
  </div>

  <div class="stats" id="stats"></div>

  <button class="secondary" onclick="voltar()">Voltar ao menu</button>
  <button class="secondary" onclick="zerarProgresso()">Zerar acertos e erros</button>
</div>

</div>

<script>
/* ================= DADOS ================= */

const flashcards = {
  portugues: [
    {
      q: "O que é compreensão textual?",
      d: "Procure informações explícitas no texto.",
      r: "É a capacidade de identificar informações explícitas presentes no texto.",
      peso: 1
    }
  ]
};

let lista = [];
let atual = 0;
let erros = [];
let modoErro = false;

let stats = JSON.parse(localStorage.getItem("stats")) || {
  acertos: 0,
  erros: 0
};

/* ================= FUNÇÕES ================= */

function embaralhar(array) {
  return array.sort(() => Math.random() - 0.5);
}

function iniciar(materia) {
  modoErro = false;
  lista = embaralhar([...flashcards[materia]]);
  atual = 0;
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("flash").classList.remove("hidden");
  atualizar();
}

function atualizar() {
  document.getElementById("pergunta").innerText = lista[atual].q;
  document.getElementById("resposta").innerText = lista[atual].r;
  document.getElementById("resposta").classList.add("hidden");
  atualizarStats();
}

function mostrarResposta() {
  document.getElementById("resposta").classList.remove("hidden");
}

function mostrarDica() {
  const dica = lista[atual].d;
  if (!dica) {
    alert("Este card não possui dica 😊");
    return;
  }
  alert("💡 Dica: " + dica);
}

function marcar(acertou) {
  if (acertou) {
    stats.acertos++;
    if (modoErro) erros.splice(atual, 1);
  } else {
    stats.erros++;
    erros.push(lista[atual]);
    lista.push(lista[atual]);
  }
  salvar();
  proximo();
}

function pular() {
  const card = lista.splice(atual, 1)[0];
  lista.push(card);
  if (atual >= lista.length) atual = 0;
  atualizar();
}

function proximo() {
  atual = (atual + 1) % lista.length;
  atualizar();
}

function atualizarStats() {
  document.getElementById("stats").innerText =
    `Acertos: ${stats.acertos} | Erros: ${stats.erros}`;
}

function salvar() {
  localStorage.setItem("stats", JSON.stringify(stats));
}

function voltar() {
  modoErro = false;
  document.getElementById("flash").classList.add("hidden");
  document.getElementById("menu").classList.remove("hidden");
}

function zerarProgresso() {
  if (confirm("Tem certeza que deseja zerar acertos e erros?")) {
    stats = { acertos: 0, erros: 0 };
    salvar();
    atualizarStats();
  }
}

function revisarErros() {
  if (erros.length === 0) {
    alert("Nenhum erro para revisar 🎉");
    return;
  }
  modoErro = true;
  lista = [...erros];
  atual = 0;
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("flash").classList.remove("hidden");
  atualizar();
}
</script>

</body>
</html>
