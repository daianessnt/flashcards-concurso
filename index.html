<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards Concurso</title>

<style>
:root {
  --bg: #f6f8fb;
  --card: #ffffff;
  --primary: #355f8a;
  --success: #2f8f5b;
  --error: #c95a5a;
  --warning: #f2b705;
  --tip: #7c5cff;
  --text: #2b2b2b;
}

body.dark {
  --bg: #121417;
  --card: #1e2228;
  --primary: #4c7bbf;
  --success: #3fbf7f;
  --error: #e06c75;
  --warning: #f1c40f;
  --tip: #9d8cff;
  --text: #e6e6e6;
}

* {
  box-sizing: border-box;
  font-family: "Segoe UI", Roboto, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

header {
  background: var(--primary);
  color: white;
  padding: 1rem;
  text-align: center;
  font-size: 1.4rem;
  position: relative;
}

.toggle-theme {
  position: absolute;
  right: 1rem;
  top: 0.8rem;
  border: none;
  border-radius: 50%;
  width: 42px;
  height: 42px;
  font-size: 1.2rem;
  background: rgba(255,255,255,0.2);
  color: white;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 1rem;
}

button {
  width: 100%;
  min-height: 48px;
  margin: 0.4rem 0;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  color: white;
  background: var(--primary);
}

button.success { background: var(--success); }
button.error { background: var(--error); }
button.warning { background: var(--warning); color:#000; }
button.secondary { background: #6c757d; }

.actions {
  display: flex;
  gap: 0.6rem;
}

.actions button {
  flex: 1;
  font-size: 1.2rem;
}

.card {
  background: var(--card);
  border-radius: 16px;
  padding: 1.6rem;
}

.pergunta { font-size: 1.2rem; text-align: center; }
.dica {
  margin-top: 1rem;
  color: var(--tip);
  background: rgba(124,92,255,.15);
  padding: .8rem;
  border-radius: 10px;
  text-align: center;
}
.resposta {
  margin-top: 1rem;
  color: var(--success);
  background: rgba(47,143,91,.15);
  padding: .8rem;
  border-radius: 10px;
  text-align: center;
}

.hidden { display: none; }
.stats { text-align:center; margin-top:.6rem; }
</style>
</head>

<body>

<header>
  Flashcards para Concurso
  <button class="toggle-theme" onclick="toggleTheme()">🌙</button>
</header>

<div class="container">

<div id="menu">
  <button onclick="iniciar('portugues')">Língua Portuguesa</button>
  <button onclick="iniciar('especificos')">Conhecimentos Específicos</button>
  <button class="error" onclick="revisarErros()">Revisar erros</button>
</div>

<div id="flash" class="hidden">
  <div class="card">
    <div id="pergunta" class="pergunta"></div>
    <div id="dica" class="dica hidden"></div>
    <div id="resposta" class="resposta hidden"></div>
  </div>

  <button onclick="mostrarDica()">💡 Dica</button>
  <button onclick="mostrarResposta()">👀 Mostrar resposta</button>

  <div class="actions">
    <button class="secondary" onclick="voltarFlash()">⬅</button>
    <button class="success" onclick="marcar(true)">✔</button>
    <button class="error" onclick="marcar(false)">✖</button>
    <button class="warning" onclick="pular()">⏭</button>
  </div>

  <div id="stats" class="stats"></div>
  <button class="secondary" onclick="voltarMenu()">Voltar ao menu</button>
  <button class="secondary" onclick="zerarProgresso()"> 🔄 Zerar acertos e erros </button>
</div>

</div>

  );
}

    "dicas": ["Foco na estrutura", "Unidade de comando"],
    "resposta": "Henri Fayol"
  },
  {
    "pergunta": "Qual modelo de organização foca na impessoalidade, hierarquia e normas escritas?",
    "dicas": ["Max Weber", "Racionalidade legal"],
    "resposta": "Burocracia"
  },
  {
    "pergunta": "O que representa a 'Amplitude Administrativa' (ou de controle)?",
    "dicas": ["Subordinados", "Gestão"],
    "resposta": "O número de subordinados que um gestor consegue supervisionar"
  },
  {
    "pergunta": "Qual a principal diferença entre Eficiência e Eficácia?",
    "dicas": ["Meios vs Fins", "Produtividade vs Resultados"],
    "resposta": "Eficiência foca nos meios (uso de recursos), Eficácia foca nos fins (atingir objetivos)"
  }
  ]
};

let lista = [];
let atual = 0;
let historico = [];

let errosSalvos = JSON.parse(localStorage.getItem("erros")) || [];
let stats = JSON.parse(localStorage.getItem("stats")) || { acertos: 0, erros: 0 };

/* ================= FUNÇÕES ================= */
function iniciar(m){
  lista = [...flashcards[m]];
  atual = 0;
  historico = [];

  // 👉 se quiser resetar stats a cada estudo, descomente:
  // stats = { acertos: 0, erros: 0 };
  // salvar();

  menu.classList.add("hidden");
  flash.classList.remove("hidden");
  atualizar();
}

function atualizar(){
  const c = lista[atual];
  pergunta.innerText = c.q;
  dica.innerText = c.d || "";
  resposta.innerText = c.r;

  dica.classList.add("hidden");
  resposta.classList.add("hidden");

  atualizarStats();
}

function atualizarStats(){
  statsEl.innerText = `Acertos: ${stats.acertos} | Erros: ${stats.erros}`;
}

function mostrarDica(){
  dica.classList.toggle("hidden");
}

function mostrarResposta(){
  resposta.classList.remove("hidden");
}

function marcar(ok){
  historico.push(atual);

  if(ok){
    stats.acertos++;
  } else {
    stats.erros++;
    errosSalvos.push(lista[atual]);
  }

  salvar();

  atual++;
  if(atual >= lista.length) atual = 0;

  atualizar();
}

function pular(){
  historico.push(atual);

  atual++;
  if(atual >= lista.length) atual = 0;

  atualizar();
}

function voltarFlash(){
  if(!historico.length) return;

  atual = historico.pop();
  atualizar();
}

function revisarErros(){
  if(!errosSalvos.length){
    alert("Sem erros 🎉");
    return;
  }

  lista = [...errosSalvos];
  atual = 0;
  historico = [];

  menu.classList.add("hidden");
  flash.classList.remove("hidden");
  atualizar();
}

function salvar(){
  localStorage.setItem("stats", JSON.stringify(stats));
  localStorage.setItem("erros", JSON.stringify(errosSalvos));
}

function voltarMenu(){
  flash.classList.add("hidden");
  menu.classList.remove("hidden");
}

function zerarProgresso(){

  stats = { acertos: 0, erros: 0 };
  errosSalvos = [];

  localStorage.removeItem("stats");
  localStorage.removeItem("erros");

  atualizar();
}


/* ================= FIX IDs ================= */
const pergunta = document.getElementById("pergunta");
const dica = document.getElementById("dica");
const resposta = document.getElementById("resposta");
const statsEl = document.getElementById("stats");
const menu = document.getElementById("menu");
const flash = document.getElementById("flash");
</script>
