<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards Concurso</title>

<style>
:root {
  --bg: #f6f8fb;
  --card: #ffffff;
  --primary: #355f8a;
  --success: #2f8f5b;
  --error: #c95a5a;
  --warning: #f0ad4e;
  --text: #2b2b2b;
}

* {
  box-sizing: border-box;
  font-family: "Segoe UI", Roboto, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

header {
  background: var(--primary);
  color: white;
  padding: 1rem;
  text-align: center;
  font-size: 1.4rem;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 1rem;
}

button {
  width: 100%;
  padding: 0.9rem;
  margin: 0.4rem 0;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  cursor: pointer;
  background: var(--primary);
  color: white;
}

button.secondary {
  background: #6c757d;
}

button.success {
  background: var(--success);
}

button.error {
  background: var(--error);
}

button.warning {
  background: var(--warning);
  color: white;
}

button:hover {
  opacity: 0.9;
  transform: scale(1.02);
}

.card {
  background: var(--card);
  border-radius: 16px;
  padding: 1.6rem;
  box-shadow: 0 6px 14px rgba(0,0,0,0.06);
}

.pergunta {
  font-size: 1.2rem;
  text-align: center;
}

.resposta, .dica {
  margin-top: 1rem;
  font-size: 1.05rem;
  text-align: center;
}

.resposta {
  color: var(--success);
}

.dica {
  color: #856404;
  background: #fff3cd;
  padding: 0.6rem;
  border-radius: 8px;
}

.hidden {
  display: none;
}

.stats {
  text-align: center;
  margin-top: 0.6rem;
  font-size: 0.9rem;
}
</style>
</head>

<body>

<header>Flashcards para Concurso</header>

<div class="container">

<!-- MENU -->
<div id="menu">
  <button onclick="iniciar('portugues')">Língua Portuguesa</button>
  <button onclick="alert('Estrutura pronta')">Raciocínio Lógico</button>
  <button onclick="alert('Estrutura pronta')">Conhecimentos Específicos</button>
  <button class="error" onclick="revisarErros()">Revisar Só Erros</button>
</div>

<!-- FLASHCARD -->
<div id="flash" class="hidden">
  <div class="card">
    <div id="pergunta" class="pergunta"></div>
    <div id="dica" class="dica hidden"></div>
    <div id="resposta" class="resposta hidden"></div>
  </div>

  <button onclick="mostrarDica()">Mostrar dica</button>
  <button onclick="mostrarResposta()">Mostrar resposta</button>

  <button class="warning" onclick="pular()">Pular</button>
  <button class="success" onclick="marcar(true)">Acertei</button>
  <button class="error" onclick="marcar(false)">Errei</button>

  <div class="stats" id="stats"></div>

  <button class="secondary" onclick="voltar()">Voltar ao menu</button>
</div>

</div>

<script>
/* ================= DADOS ================= */

const flashcards = {
  portugues: [
    {
      pergunta: "O que é semântica?",
      resposta: "É o estudo do significado das palavras e expressões.",
      dica: "Pense no sentido das palavras."
    },
    {
      pergunta: "O que é sintaxe?",
      resposta: "É a parte da gramática que estuda a organização das palavras na frase.",
      dica: "Está relacionada à estrutura da frase."
    }
  ]
};

let fila = [];
let erros = [];
let atual = null;
let revisandoErros = false;

/* ================= FUNÇÕES ================= */

function iniciar(materia) {
  fila = [...flashcards[materia]];
  erros = JSON.parse(localStorage.getItem("erros")) || [];
  revisandoErros = false;
  mostrarProximo();
}

function revisarErros() {
  erros = JSON.parse(localStorage.getItem("erros")) || [];
  if (erros.length === 0) {
    alert("Nenhum erro para revisar 🎉");
    return;
  }
  fila = [...erros];
  revisandoErros = true;
  mostrarProximo();
}

function mostrarProximo() {
  if (fila.length === 0) {
    voltar();
    return;
  }

  atual = fila.shift();
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("flash").classList.remove("hidden");

  document.getElementById("pergunta").innerText = atual.pergunta;
  document.getElementById("resposta").innerText = atual.resposta;
  document.getElementById("dica").innerText = atual.dica || "";

  document.getElementById("resposta").classList.add("hidden");
  document.getElementById("dica").classList.add("hidden");

  atualizarStats();
}

function mostrarResposta() {
  document.getElementById("resposta").classList.remove("hidden");
}

function mostrarDica() {
  if (atual.dica) {
    document.getElementById("dica").classList.remove("hidden");
  }
}

function marcar(acertou) {
  if (!acertou) {
    erros.push(atual);
    localStorage.setItem("erros", JSON.stringify(erros));
  }
  mostrarProximo();
}

function pular() {
  fila.push(atual); // volta para o fim da fila
  mostrarProximo();
}

function voltar() {
  document.getElementById("flash").classList.add("hidden");
  document.getElementById("menu").classList.remove("hidden");
}

function atualizarStats() {
  document.getElementById("stats").innerText =
    `Cartões restantes: ${fila.length}`;
}
</script>

</body>
</html>
